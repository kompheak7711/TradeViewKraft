name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: python3 scripts/contrast.py
      - run: pnpm --filter @tvk/web build
      - run: pnpm --filter @tvk/web exec playwright install --with-deps chromium webkit
      - run: E2E_WEBKIT=1 pnpm --filter @tvk/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
